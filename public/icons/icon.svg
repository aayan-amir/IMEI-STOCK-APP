<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1a1a18" />
  <g filter="url(#shadow)">
    <!-- Phone outline -->
    <rect x="156" y="96" width="200" height="320" rx="36" fill="#f5f3ee" stroke="url(#grad)" stroke-width="12" />
    <!-- Screen notch / bar -->
    <rect x="216" y="120" width="80" height="6" rx="3" fill="#a8a49e" />
    <!-- Barcode stripes -->
    <rect x="188" y="170" width="8" height="70" rx="4" fill="#1c1917" />
    <rect x="204" y="170" width="16" height="70" rx="4" fill="#16a34a" />
    <rect x="228" y="170" width="6" height="70" rx="3" fill="#1c1917" />
    <rect x="242" y="170" width="20" height="70" rx="4" fill="#0284c7" />
    <rect x="270" y="170" width="10" height="70" rx="4" fill="#1c1917" />
    <rect x="288" y="170" width="18" height="70" rx="4" fill="#16a34a" />
    <rect x="314" y="170" width="10" height="70" rx="4" fill="#1c1917" />
    <!-- Checkmark badge -->
    <circle cx="336" cy="350" r="42" fill="url(#grad)" />
    <path d="M320 350 L332 362 L356 338" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
